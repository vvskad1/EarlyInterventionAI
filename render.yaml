services:
  - type: web
    name: earlyintervention-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: KB_FILE
        value: ./kb/knowledge_base.txt
      - key: RAG_CONTEXT_BUDGET
        value: 6000
